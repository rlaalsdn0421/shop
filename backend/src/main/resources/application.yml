spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:51214/template1?sslmode=disable&prepareThreshold=0}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

jwt:
  # Local-dev fallback only — MUST be overridden via the JWT_SECRET env var for any real deployment.
  secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-me-32chars}

seed:
  # Intentionally no defaults: an ADMIN/SELLER account is only created when both its username and
  # password env vars are set (ADMIN_USERNAME/ADMIN_PASSWORD, SELLER_USERNAME/SELLER_PASSWORD).
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  seller-username: ${SELLER_USERNAME:}
  seller-password: ${SELLER_PASSWORD:}
